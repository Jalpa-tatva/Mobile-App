name: iOS Build

on:
  push:
    branches:
      - main
      - mobile_development

  pull_request:
    branches:
      - main
      - mobile_development

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: yarn

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.2

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Create ENV File
        run: |
          echo "${{ secrets.ENV_FILES }}" > .env

      - name: Verify ENV File
        run: |
          if [ -f .env ]; then
            echo ".env created"
          else
            echo ".env missing"
            exit 1
          fi

      - name: Install Dependencies
        run: yarn install --frozen-lockfile

      - name: Install CocoaPods
        run: |
          cd ios
          pod install --repo-update

      - name: Build iOS
        env:
          ENVFILE: .env
        run: |
          cd ios
          xcodebuild \
            -workspace EpioneCares.xcworkspace \
            -scheme EpioneCares \
            -sdk iphonesimulator \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Upload iOS Build Logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-build-data
          path: ios/build