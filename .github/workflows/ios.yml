name: iOS Build

on:
  push:
    branches:
      - main
      - mobile_development

  pull_request:
    branches:
      - main
      - mobile_development

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_16.2.app

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: yarn

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.1

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Dependencies
        run: yarn install --frozen-lockfile

      - name: Create ENV File
        run: |
          echo "${{ secrets.ENVFILES }}" > .env.production

      - name: Set NODE_BINARY
        run: |
          echo "export NODE_BINARY=$(which node)" > ios/.xcode.env.local

      - name: Install CocoaPods
        run: |
          cd ios
          pod deintegrate
          rm -rf Pods Podfile.lock
          arch -arm64 pod install --repo-update

      - name: Install Signing Certificate & Provisioning Profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_PROVISION_BASE64 }}
          KEYCHAIN_PASSWORD: temp_keychain_password
        run: |

          CERTIFICATE_PATH=$RUNNER_TEMP/certificate.p12
          PP_PATH=$RUNNER_TEMP/profile.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          security import $CERTIFICATE_PATH \
            -P "$P12_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k $KEYCHAIN_PATH

          security list-keychains -d user -s $KEYCHAIN_PATH login.keychain-db

          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            $KEYCHAIN_PATH

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles

          UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' /dev/stdin <<< "$(security cms -D -i $PP_PATH)")

          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/$UUID.mobileprovision

      - name: Debug Code Signing
        run: |
          security find-identity -v -p codesigning
          ls -la ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Show Provision Profile Details
        run: |
          security cms -D -i ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision > profile.plist
          cat profile.plist | grep -A 20 DeveloperCertificates

      - name: Clean DerivedData
        run: |
          rm -rf ~/Library/Developer/Xcode/DerivedData

      - name: Verify Signing Setup
        run: |

          echo "==== SIGNING IDENTITIES ===="
          security find-identity -v -p codesigning

          echo "==== PROFILES ===="
          ls -la ~/Library/MobileDevice/Provisioning\ Profiles/

          echo "==== PROFILE DETAILS ===="
          security cms -D \
            -i ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision \
            | grep -A 30 Name

      - name: Build Archive
        env:
          ENVFILE: .env.production
        run: |

          cd ios

          xcodebuild \
            -workspace EpioneCares.xcworkspace \
            -scheme EpioneCares \
            -configuration Release \
            -sdk iphoneos \
            -destination generic/platform=iOS \
            -archivePath build/EpioneCares.xcarchive \
            DEVELOPMENT_TEAM=9HQ94SK78R \
            PRODUCT_BUNDLE_IDENTIFIER=com.concursive.epionecares \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Development" \
            PROVISIONING_PROFILE_SPECIFIER="EpioneCares" \
            clean archive

      - name: Export IPA
        run: |

          cd ios

          xcodebuild \
            -exportArchive \
            -archivePath build/EpioneCares.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: EpioneCares-IPA
          path: ios/build/ipa/*.ipa

      - name: Upload Build Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-logs
          path: |
            ios/build
            ~/Library/Logs/DiagnosticReports